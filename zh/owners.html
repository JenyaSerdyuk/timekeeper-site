14:09:00Z"], ["keychain", "noor", "2026-11-01T22:44:00Z"]], "limit": 0, "img": "/img/", "lang": "zh", "dev": {"painting": "画", "keychain": "钥匙扣", "watch": "手表", "watch2": "指针手表", "pendant": "吊坠"}, "sec": "秒", "since": "始于"};var SEGS='abcdefg',SMAP=['abcdef','bc','abged','abgcd','fgbc','afgcd','afgedc','abc','abcdefg','abcdfg'];
var list=document.getElementById('ownList'); if(!list) return;

function draw(it,val){var d=it.d; it.num.textContent=fmt(val); if(!it.at.complete||!it.at.naturalWidth) return;
  var s=String(Math.floor(val)%Math.pow(10,d.n)).padStart(d.n,'0'); if(it.s===s) return; it.s=s; var x=it.x,k=it.k;
